# FALLBACK ONLY (2026-09-08): GitHub throttles `schedule:` on quiet repos — this fired every ~4 h, not every 5 min.
# The real 5-minute tick is Supabase pg_cron (supabase/migrations/0004_pg_cron_tick.sql). This stays for
# manual runs (workflow_dispatch) and as a coarse safety net if Supabase cron is ever off.
# Needs repository secrets: SNAPSHOT_URL (https://stonk.fyi) and CRON_SECRET (same value as on Vercel).
name: snapshot
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      census:
        description: "Run the wallet census (?census=1) on this tick"
        type: boolean
        default: false
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/snapshot
        env:
          SNAPSHOT_URL: ${{ secrets.SNAPSHOT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          full=""
          # top of the hour → wider token snapshot (top 500); the daily full walk runs from Vercel cron
          if [ "$(date -u +%M)" -lt 5 ]; then full="?hourly=1"; fi
          # manual run with the census box ticked → on-demand wallet census (CLAUDE.md §6f)
          if [ "${{ inputs.census }}" = "true" ]; then full="?census=1"; fi
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" --max-time 280 \
            -H "Authorization: Bearer $CRON_SECRET" "$SNAPSHOT_URL/api/cron/snapshot$full")
          echo "HTTP $code"; cat /tmp/out.json | head -c 4000; echo
          [ "$code" = "200" ]
